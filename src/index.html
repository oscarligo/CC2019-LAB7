<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        />
        <title>Regex to AFN</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>

    <body>
        <main class="container">
        <h1>Regex to Automaton Converter</h1>


        <section aria-labelledby="manual-view-title">
        <h2 id="manual-view-title">Infix expression</h2>

        <form id="regex-form">

            <div class="controls">
            <input
                id="regex-input"
                value="[A-Z]→([A-Za-z0-9]+(\|([A-Za-z0-9]+))*|☻)"
                placeholder="Infix expression"
                autocomplete="off"
            />

            <input
                id="string-input"
                value="S→a|B"
                placeholder="String to evaluate (ε = empty)"
                autocomplete="off"
            />

            <button type="submit">
                Convert
            </button>
            </div>
        </form>

        <section class="result">
            <p>
            Explicit concatenation:
            <code id="formatted-output"></code>
            </p>

            <p>
            Postfix notation:
            <code id="postfix-output"></code>
            </p>

            <p id="error-output" role="alert"></p>
        </section>

        <h3> NFA (Thompson algorithm)</h3>
        <div id="nfa-container" class="nfa-graph" role="img" aria-label="NFA of the regular expression"></div>

        <h3> DFA (subset construction algorithm)</h3>
        <div id="dfa-container" class="dfa-graph" role="img" aria-label="DFA of the regular expression"></div>

        <h3> Minimized DFA  (partitioning algorithm)</h3>
        <div id="minimized-dfa-container" class="dfa-graph" role="img" aria-label="DFA of the regular expression"></div>
        </section>
        </main>

        <script type="module" src="/main.ts"></script>
    </body>
</html>
